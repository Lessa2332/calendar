<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Магічний пазл</title>

  <!-- A-Frame + MindAR -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <!-- Стилі -->
  <style>
    /* Головне: фон — прозорий */
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
      font-family: 'Comic Sans MS', cursive, sans-serif;
      touch-action: none;
    }

    /* Canvas для пазлу — прозорий */
    #puzzleCanvas {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      background: transparent;
    }

    /* Кнопка закриття — маленька, у куті */
    #closeBtn {
      position: fixed;
      top: max(15px, env(safe-area-inset-top, 15px));
      right: 15px;
      width: 40px;
      height: 40px;
      background: #ff1493;
      color: white;
      border: none;
      border-radius: 50%;
      font-size: 20px;
      z-index: 101;
      display: none;
      cursor: pointer;
    }

    /* Екран перемоги — напівпрозорий, по центру */
    #winScreen {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.7);
      color: gold;
      font-size: 48px;
      z-index: 200;
      flex-direction: column;
      backdrop-filter: blur(10px);
    }
  </style>
</head>
<body>

  <!-- Canvas для пазлу -->
  <canvas id="puzzleCanvas"></canvas>

  <!-- Кнопка закриття (з'являється при пазлі) -->
  <button id="closeBtn">✕</button>

  <!-- Екран перемоги -->
  <div id="winScreen">🎉 УРААА! Ти — найкраща чарівниця!</div>

  <!-- AR сцена -->
  <a-scene 
    embedded
    mindar-image="imageTargetSrc: ./calendar.mind; filterMinCF:0.0001; filterBeta:0.001; warmupTolerance:3; autoStart:false;"
    renderer="colorManagement:true; physicallyCorrectLights:true; antialias:true; background:transparent;"
    vr-mode-ui="enabled:false"
    device-orientation-permission-ui="enabled:false"
    loading-screen="enabled:false"
    style="position:fixed;inset:0;background:transparent !important;">
    <a-camera active="false"></a-camera>
  </a-scene>

  <script>
    // Конфігурація: 12 пазлів
    const PUZZLES = Array.from({length: 12}, (_, i) => ({
      id: i,
      image: `images/${String(i + 1).padStart(2, '0')}.jpg`
    }));

    let currentPuzzle = null;

    // === Рендерер пазлу ===
    class PuzzleRenderer {
      constructor(canvas) {
        this.canvas = canvas;
        this.ctx = canvas.getContext('2d', { alpha: true });
        this.resize();
        window.addEventListener('resize', () => this.resize());
      }
      resize() {
        this.canvas.width = window.innerWidth;
        this.canvas.height = window.innerHeight;
      }
      render(pieces, dragged) {
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        if (!pieces) return;
        const w = Math.min(180, window.innerWidth / 4);
        const h = w;
        pieces.forEach(piece => {
          this.ctx.drawImage(piece.image, piece.x, piece.y, w, h);
          if (piece === dragged) {
            this.ctx.strokeStyle = '#ff1493';
            this.ctx.lineWidth = 3;
            this.ctx.strokeRect(piece.x, piece.y, w, h);
          }
        });
        this.ctx.fillStyle = 'white';
        this.ctx.font = 'bold 20px "Comic Sans MS"';
        this.ctx.textAlign = 'center';
        this.ctx.fillText('Перетягуй шматочки!', window.innerWidth / 2, 60);
      }
    }

    // === Логіка пазлу ===
    class PuzzleEngine {
      constructor(config, renderer) {
        this.config = config;
        this.renderer = renderer;
        this.pieces = [];
        this.dragged = null;
        this.offset = { x: 0, y: 0 };
        this.init();
      }
      async init() {
        try {
          const img = new Image();
          img.src = this.config.image;
          await img.decode();
          this.createPieces(img);
        } catch {
          this.createFallback();
        }
        this.bindEvents();
        this.renderer.render(this.pieces);
      }
      createPieces(img) {
        const w = Math.min(180, window.innerWidth / 4);
        const h = w;
        for (let i = 0; i < 9; i++) {
          const canvas = document.createElement('canvas');
          canvas.width = img.width / 3;
          canvas.height = img.height / 3;
          const ctx = canvas.getContext('2d');
          const row = Math.floor(i / 3);
          const col = i % 3;
          ctx.drawImage(img, col * img.width/3, row * img.height/3, img.width/3, img.height/3, 0, 0, canvas.width, canvas.height);
          const pieceImg = new Image(); pieceImg.src = canvas.toDataURL();
          this.pieces.push({
            image: pieceImg,
            x: Math.random() * (window.innerWidth - w),
            y: Math.random() * (window.innerHeight - h),
            tx: (window.innerWidth - w * 3) / 2 + (i % 3) * w,
            ty: (window.innerHeight - h * 3) / 2 + Math.floor(i / 3) * h,
            width: w, height: h, ok: false
          });
        }
        this.shuffle();
      }
      createFallback() {
        const cols = ['#FF6B6B','#4ECDC4','#45B7D1'];
        const w = 120;
        for (let i = 0; i < 9; i++) {
          const canvas = document.createElement('canvas'); canvas.width = canvas.height = w;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = cols[i % cols.length]; ctx.fillRect(0,0,w,w);
          ctx.fillStyle = 'white'; ctx.font = '40px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(i+1, w/2, w/2);
          const img = new Image(); img.src = canvas.toDataURL();
          this.pieces.push({
            image: img, x: Math.random()*(window.innerWidth-w), y: Math.random()*(window.innerHeight-w),
            tx: (window.innerWidth - w*3)/2 + (i%3)*w, ty: (window.innerHeight - w*3)/2 + Math.floor(i/3)*w,
            width: w, height: w, ok: false
          });
        }
      }
      shuffle() {
        for (let i = this.pieces.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [this.pieces[i], this.pieces[j]] = [this.pieces[j], this.pieces[i]];
        }
      }
      bindEvents() {
        const c = this.renderer.canvas;
        const startDrag = e => {
          const r = c.getBoundingClientRect();
          const x = (e.clientX || e.touches?.[0].clientX) - r.left;
          const y = (e.clientY || e.touches?.[0].clientY) - r.top;
          for (let i = this.pieces.length - 1; i >= 0; i--) {
            const p = this.pieces[i];
            if (x >= p.x && x <= p.x + p.width && y >= p.y && y <= p.y + p.height) {
              this.dragged = p;
              this.offset = { x: x - p.x, y: y - p.y };
              this.pieces.splice(i, 1);
              this.pieces.push(p);
              break;
            }
          }
        };
        const drag = e => {
          if (!this.dragged) return;
          e.preventDefault();
          const r = c.getBoundingClientRect();
          const x = (e.clientX || e.touches?.[0].clientX) - r.left;
          const y = (e.clientY || e.touches?.[0].clientY) - r.top;
          this.dragged.x = x - this.offset.x;
          this.dragged.y = y - this.offset.y;
          this.renderer.render(this.pieces, this.dragged);
        };
        const endDrag = () => {
          if (!this.dragged) return;
          const d = Math.hypot(
            this.dragged.x + this.dragged.width / 2 - (this.dragged.tx + this.dragged.width / 2),
            this.dragged.y + this.dragged.height / 2 - (this.dragged.ty + this.dragged.height / 2)
          );
          if (d < 50) {
            this.dragged.x = this.dragged.tx;
            this.dragged.y = this.dragged.ty;
            this.dragged.ok = true;
            this.check();
          }
          this.dragged = null;
          this.renderer.render(this.pieces);
        };
        c.addEventListener('mousedown', startDrag);
        c.addEventListener('touchstart', startDrag, { passive: false });
        c.addEventListener('mousemove', drag);
        c.addEventListener('touchmove', drag, { passive: false });
        c.addEventListener('mouseup', endDrag);
        c.addEventListener('touchend', endDrag);
      }
      check() {
        if (this.pieces.every(p => p.ok)) {
          confetti({ particleCount: 300, spread: 100, origin: { y: 0.6 } });
          document.getElementById('winScreen').style.display = 'flex';
          setTimeout(() => {
            document.getElementById('winScreen').style.display = 'none';
            this.destroy();
            currentPuzzle = null;
            document.getElementById('puzzleCanvas').style.display = 'none';
            document.getElementById('closeBtn').style.display = 'none';
          }, 3000);
        }
      }
      render() { this.renderer.render(this.pieces, this.dragged); }
      destroy() {
        const c = this.renderer.canvas;
        c.parentNode.replaceChild(c.cloneNode(true), c);
      }
    }

    // === Запуск AR ===
    const scene = document.querySelector('a-scene');

    // Запросити камеру і запустити AR
    (async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        stream.getTracks().forEach(t => t.stop());
        scene.systems['mindar-image-system'].start();
      } catch (e) {
        alert("Будь ласка, дозволь доступ до камери!");
      }
    })();

    scene.addEventListener('loaded', () => {
      PUZZLES.forEach(cfg => {
        const ent = document.createElement('a-entity');
        ent.setAttribute('mindar-image-target', `targetIndex: ${cfg.id}`);
        ent.addEventListener('targetFound', () => {
          if (!currentPuzzle) {
            currentPuzzle = new PuzzleEngine(cfg, new PuzzleRenderer(document.getElementById('puzzleCanvas')));
            document.getElementById('puzzleCanvas').style.display = 'block';
            document.getElementById('closeBtn').style.display = 'block';
          }
        });
        scene.appendChild(ent);
      });
    });

    // Закриття пазлу
    document.getElementById('closeBtn').onclick = () => {
      if (currentPuzzle) {
        currentPuzzle.destroy();
        currentPuzzle = null;
      }
      document.getElementById('puzzleCanvas').style.display = 'none';
      document.getElementById('closeBtn').style.display = 'none';
    };
  </script>
</body>
</html>
