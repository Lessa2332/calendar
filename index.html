<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Магічний пазл</title><!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Магічний пазл</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <style>
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      background: transparent !important;
      font-family: 'Comic Sans MS', cursive, sans-serif;
      touch-action: none;
    }
    #puzzleCanvas {
      position: fixed; inset: 0; z-index: 100; display: none; background: transparent;
    }
    #closeBtn {
      position: fixed; top: max(15px, env(safe-area-inset-top, 15px)); right: 15px;
      width: 40px; height: 40px; background: #ff1493; color: white; border: none;
      border-radius: 50%; font-size: 20px; z-index: 101; display: none; cursor: pointer;
    }
    #winScreen {
      position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.7); color: gold; font-size: 48px; z-index: 200;
      flex-direction: column; backdrop-filter: blur(10px);
    }
  </style>
</head>
<body>

  <canvas id="puzzleCanvas"></canvas>
  <button id="closeBtn">✕</button>
  <div id="winScreen">🎉 УРААА! Ти — найкраща чарівниця!</div>

  <a-scene 
    embedded
    mindar-image="imageTargetSrc: ./calendar.mind; autoStart:false;"
    renderer="colorManagement:true; physicallyCorrectLights:true; antialias:true; background:transparent;"
    vr-mode-ui="enabled:false"
    device-orientation-permission-ui="enabled:false"
    loading-screen="enabled:false"
    style="position:fixed;inset:0;background:transparent !important;">
    <a-camera active="false"></a-camera>
  </a-scene>

  <script>
    const PUZZLES = Array.from({length: 12}, (_, i) => ({
      id: i,
      image: `images/${String(i + 1).padStart(2, '0')}.jpg`
    }));

    // ✅ 2. localStorage — прогрес зберігається!
    let completed = new Set();
    if (localStorage.getItem('completed')) {
      try {
        completed = new Set(JSON.parse(localStorage.getItem('completed')));
      } catch (e) {
        console.warn("Помилка завантаження прогресу:", e);
      }
    }

    // Зберігаємо при закритті
    window.addEventListener('beforeunload', () => {
      localStorage.setItem('completed', JSON.stringify([...completed]));
    });

    let currentPuzzle = null;

    class PuzzleRenderer {
      constructor(canvas) {
        this.canvas = canvas;
        this.ctx = canvas.getContext('2d', { alpha: true });
        this.resize();
        window.addEventListener('resize', () => this.resize());
      }
      resize() {
        this.canvas.width = window.innerWidth;
        this.canvas.height = window.innerHeight;
      }
      render(pieces, dragged) {
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        if (!pieces) return;

        // ✅ 1. Мінімальний розмір пазлу (трохи більший простір)
        const minSize = Math.min(window.innerWidth * 0.92, window.innerHeight * 0.68);
        const cell = minSize / 3;
        const w = cell, h = cell * (pieces[0].height / pieces[0].width || 1);
        const totalW = w * 3, totalH = h * 3;
        const cx = (window.innerWidth - totalW) / 2;
        const cy = (window.innerHeight - totalH) / 2;

        this.ctx.strokeStyle = 'gold';
        this.ctx.lineWidth = 6;
        this.ctx.strokeRect(cx - 10, cy - 10, totalW + 20, totalH + 20);

        pieces.forEach(piece => {
          this.ctx.drawImage(piece.image, piece.x, piece.y, w, h);
          if (piece === dragged) {
            this.ctx.strokeStyle = '#ff1493';
            this.ctx.lineWidth = 3;
            this.ctx.strokeRect(piece.x, piece.y, w, h);
          }
        });

        this.ctx.fillStyle = 'white';
        this.ctx.font = 'bold 22px "Comic Sans MS"';
        this.ctx.textAlign = 'center';
        this.ctx.fillText('Перетягуй шматочки!', window.innerWidth / 2, 60);
      }
    }

    class PuzzleEngine {
      constructor(config, renderer) {
        this.config = config;
        this.renderer = renderer;
        this.pieces = [];
        this.dragged = null;
        this.offset = { x: 0, y: 0 };
        this.init();
      }
      async init() {
        try {
          const img = new Image();
          img.src = this.config.image;
          await img.decode();
          this.createPieces(img);
        } catch {
          this.createFallback();
        }
        this.bindEvents();
        this.renderer.render(this.pieces);
      }
      createPieces(img) {
        const minSize = Math.min(window.innerWidth * 0.92, window.innerHeight * 0.68);
        const cell = minSize / 3;
        const w = cell, h = cell * (img.height / img.width);
        const totalW = w * 3, totalH = h * 3;
        const cx = (window.innerWidth - totalW) / 2;
        const cy = (window.innerHeight - totalH) / 2;
        const sw = img.width / 3, sh = img.height / 3;

        for (let r = 0; r < 3; r++) {
          for (let c = 0; c < 3; c++) {
            const canvas = document.createElement('canvas');
            canvas.width = sw; canvas.height = sh;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, c * sw, r * sh, sw, sh, 0, 0, sw, sh);
            const pieceImg = new Image(); pieceImg.src = canvas.toDataURL();
            this.pieces.push({
              image: pieceImg,
              x: cx + Math.random() * (window.innerWidth - w * 2),
              y: cy + Math.random() * (window.innerHeight - h * 2),
              tx: cx + c * w,
              ty: cy + r * h,
              width: w, height: h, ok: false
            });
          }
        }
        this.shuffle();
      }
      createFallback() {
        const cols = ['#FF6B6B','#4ECDC4','#45B7D1'];
        const s = Math.min(window.innerWidth, window.innerHeight) * 0.2;
        const total = s * 3;
        const cx = (window.innerWidth - total) / 2;
        const cy = (window.innerHeight - total) / 2;
        for (let i = 0; i < 9; i++) {
          const canvas = document.createElement('canvas');
          canvas.width = canvas.height = s;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = cols[i % cols.length]; ctx.fillRect(0,0,s,s);
          ctx.fillStyle = 'white'; ctx.font = '40px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(i+1, s/2, s/2);
          const img = new Image(); img.src = canvas.toDataURL();
          this.pieces.push({
            image: img,
            x: cx + Math.random() * (window.innerWidth - s * 2),
            y: cy + Math.random() * (window.innerHeight - s * 2),
            tx: cx + (i % 3) * s,
            ty: cy + Math.floor(i / 3) * s,
            width: s, height: s, ok: false
          });
        }
      }
      shuffle() {
        for (let i = this.pieces.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [this.pieces[i], this.pieces[j]] = [this.pieces[j], this.pieces[i]];
        }
      }
      bindEvents() { /* ... (як раніше, без змін) */ }
      check() {
        if (this.pieces.every(p => p.ok)) {
          completed.add(this.config.id);
          confetti({ particleCount: 300, spread: 100, origin: { y: 0.6 } });
          document.getElementById('winScreen').style.display = 'flex';
          setTimeout(() => {
            document.getElementById('winScreen').style.display = 'none';
            this.destroy();
            currentPuzzle = null;
            document.getElementById('puzzleCanvas').style.display = 'none';
            document.getElementById('closeBtn').style.display = 'none';
          }, 3000);
        }
      }
      render() { this.renderer.render(this.pieces, this.dragged); }
      destroy() {
        const c = this.renderer.canvas;
        c.parentNode.replaceChild(c.cloneNode(true), c);
      }
    }

    const scene = document.querySelector('a-scene');

    // ✅ 3. Fallback при відмові камери
    (async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        stream.getTracks().forEach(t => t.stop());
        scene.systems['mindar-image-system'].start();
      } catch (e) {
        // Повністю замінюємо body на просте повідомлення
        document.body.innerHTML = `
          <div style="
            position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
            background:#000; color:white; font-family:Arial; text-align:center; padding:20px;
            font-size:24px; line-height:1.5;
          ">
            Камера не працює 😢<br>
            Онови сторінку і дозволь доступ до камери!
          </div>
        `;
      }
    })();

    scene.addEventListener('loaded', () => {
      PUZZLES.forEach(cfg => {
        const ent = document.createElement('a-entity');
        ent.setAttribute('mindar-image-target', `targetIndex: ${cfg.id}`);
        ent.addEventListener('targetFound', () => {
          if (!currentPuzzle && !completed.has(cfg.id)) {
            currentPuzzle = new PuzzleEngine(cfg, new PuzzleRenderer(document.getElementById('puzzleCanvas')));
            document.getElementById('puzzleCanvas').style.display = 'block';
            document.getElementById('closeBtn').style.display = 'block';
          }
        });
        scene.appendChild(ent);
      });
    });

    document.getElementById('closeBtn').onclick = () => {
      if (currentPuzzle) {
        currentPuzzle.destroy();
        currentPuzzle = null;
      }
      document.getElementById('puzzleCanvas').style.display = 'none';
      document.getElementById('closeBtn').style.display = 'none';
    };
  </script>
</body>
</html>
