<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Магічний пазл</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
      font-family: 'Comic Sans MS', cursive, sans-serif;
      touch-action: none;
    }
    #puzzleCanvas {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      background: transparent;
      pointer-events: auto; /* ✅ */
    }
    #closeBtn {
      position: fixed;
      top: max(15px, env(safe-area-inset-top, 15px));
      right: 15px;
      width: 40px;
      height: 40px;
      background: #ff1493;
      color: white;
      border: none;
      border-radius: 50%;
      font-size: 20px;
      z-index: 101;
      display: none;
      cursor: pointer;
      pointer-events: auto; /* ✅ */
    }
    #winScreen {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.7);
      color: gold;
      font-size: 48px;
      z-index: 200;
      flex-direction: column;
      backdrop-filter: blur(10px);
    }

    /* ✅ Привітання для дитини */
    #hint {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.6);
      color: white;
      padding: 12px 20px;
      border-radius: 14px;
      font-family: 'Comic Sans MS', cursive;
      font-size: 22px;
      text-align: center;
      z-index: 999;
      backdrop-filter: blur(8px);
    }
  </style>
</head>
<body>

  <!-- ✅ Привітання -->
  <div id="hint">✨ Наведи камеру на картинку!<br>І побачиш чарівний пазл!</div>

  <canvas id="puzzleCanvas"></canvas>
  <button id="closeBtn">✕</button>
  <div id="winScreen">🎉 УРААА!</div>

  <a-scene 
    embedded
    mindar-image="imageTargetSrc: ./calendar.mind; filterMinCF:0.0001; filterBeta:0.001; warmupTolerance:3; autoStart:false;"
    renderer="colorManagement:true; physicallyCorrectLights:true; antialias:true; background:transparent;"
    vr-mode-ui="enabled:false"
    device-orientation-permission-ui="enabled:false"
    loading-screen="enabled:false"
    style="position:fixed;inset:0;background:transparent !important;">
    <a-camera active="false"></a-camera>
  </a-scene>

  <script>
    const PUZZLES = Array.from({length: 12}, (_, i) => ({
      id: i,
      image: `images/${String(i + 1).padStart(2, '0')}.jpg`
    }));

    let completed = new Set();
    if (localStorage.getItem('completed')) {
      try {
        completed = new Set(JSON.parse(localStorage.getItem('completed')));
      } catch (e) {
        console.warn("Не вдалося завантажити прогрес:", e);
      }
    }
    window.addEventListener('beforeunload', () => {
      localStorage.setItem('completed', JSON.stringify([...completed]));
    });

    let currentPuzzle = null;

    class PuzzleRenderer {
      constructor(canvas) {
        this.canvas = canvas;
        this.ctx = canvas.getContext('2d', { alpha: true });
        this.resize();
        window.addEventListener('resize', () => this.resize());
      }
      resize() {
        this.canvas.width = window.innerWidth;
        this.canvas.height = window.innerHeight;
      }
      render(pieces, dragged) {
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        if (!pieces) return;

        const minSize = Math.min(window.innerWidth * 0.92, window.innerHeight * 0.68);
        const cell = minSize / 3;
        const w = cell;
        const h = cell * (pieces[0].height / pieces[0].width || 1);
        const totalW = w * 3;
        const totalH = h * 3;
        const cx = (window.innerWidth - totalW) / 2;
        const cy = (window.innerHeight - totalH) / 2;

        this.ctx.strokeStyle = 'gold';
        this.ctx.lineWidth = 6;
        this.ctx.strokeRect(cx - 10, cy - 10, totalW + 20, totalH + 20);

        pieces.forEach(piece => {
          this.ctx.drawImage(piece.image, piece.x, piece.y, w, h);
          if (piece === dragged) {
            this.ctx.strokeStyle = '#ff1493';
            this.ctx.lineWidth = 3;
            this.ctx.strokeRect(piece.x, piece.y, w, h);
          }
        });

        this.ctx.fillStyle = 'white';
        this.ctx.font = 'bold 22px "Comic Sans MS"';
        this.ctx.textAlign = 'center';
        this.ctx.fillText('Перетягуй шматочки!', window.innerWidth / 2, 60);
      }
    }

    class PuzzleEngine {
      constructor(config, renderer) {
        this.config = config;
        this.renderer = renderer;
        this.pieces = [];
        this.dragged = null;
        this.offset = { x: 0, y: 0 };
        this.init();
      }
      async init() {
        try {
          const img = new Image();
          // ✅ Надійне завантаження (проти помилок на Xiaomi/Huawei)
          await new Promise((resolve, reject) => {
            img.onload = () => {
              if (!img.complete || img.naturalWidth === 0) {
                reject(new Error("Image incomplete"));
              } else {
                resolve();
              }
            };
            img.onerror = reject;
            img.src = this.config.image;
          });
          this.createPieces(img);
        } catch (e) {
          console.warn("Помилка завантаження зображення:", this.config.image, e);
          this.createFallback();
        }
        this.bindEvents();
        this.renderer.render(this.pieces);
      }
      createPieces(img) {
        const minSize = Math.min(window.innerWidth * 0.92, window.innerHeight * 0.68);
        const cell = minSize / 3;
        const w = cell;
        const h = cell * (img.height / img.width);
        const totalW = w * 3;
        const totalH = h * 3;
        const cx = (window.innerWidth - totalW) / 2;
        const cy = (window.innerHeight - totalH) / 2;
        const sw = img.width / 3;
        const sh = img.height / 3;

        for (let r = 0; r < 3; r++) {
          for (let c = 0; c < 3; c++) {
            const canvas = document.createElement('canvas');
            canvas.width = sw;
            canvas.height = sh;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, c * sw, r * sh, sw, sh, 0, 0, sw, sh);
            const pieceImg = new Image();
            pieceImg.src = canvas.toDataURL();
            this.pieces.push({
              image: pieceImg,
              x: cx + Math.random() * (window.innerWidth - w * 2),
              y: cy + Math.random() * (window.innerHeight - h * 2),
              tx: cx + c * w,
              ty: cy + r * h,
              width: w, height: h, ok: false
            });
          }
        }
        this.shuffle();
      }
      createFallback() {
        const cols = ['#FF6B6B','#4ECDC4','#45B7D1'];
        const s = Math.min(window.innerWidth, window.innerHeight) * 0.2;
        const total = s * 3;
        const cx = (window.innerWidth - total) / 2;
        const cy = (window.innerHeight - total) / 2;
        for (let i = 0; i < 9; i++) {
          const canvas = document.createElement('canvas');
          canvas.width = canvas.height = s;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = cols[i % cols.length];
          ctx.fillRect(0, 0, s, s);
          ctx.fillStyle = 'white';
          ctx.font = '40px Arial';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(i + 1, s / 2, s / 2);
          this.pieces.push({
            image: canvas, // ✅ використовуємо canvas напряму (без toDataURL)
            x: cx + Math.random() * (window.innerWidth - s * 2),
            y: cy + Math.random() * (window.innerHeight - s * 2),
            tx: cx + (i % 3) * s,
            ty: cy + Math.floor(i / 3) * s,
            width: s, height: s, ok: false
          });
        }
      }
      shuffle() {
        for (let i = this.pieces.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [this.pieces[i], this.pieces[j]] = [this.pieces[j], this.pieces[i]];
        }
      }
      bindEvents() {
        const c = this.renderer.canvas;
        const startDrag = e => {
          const r = c.getBoundingClientRect();
          const x = (e.clientX || e.touches?.[0].clientX) - r.left;
          const y = (e.clientY || e.touches?.[0].clientY) - r.top;
          for (let i = this.pieces.length - 1; i >= 0; i--) {
            const p = this.pieces[i];
            if (x >= p.x && x <= p.x + p.width && y >= p.y && y <= p.y + p.height) {
              this.dragged = p;
              this.offset = { x: x - p.x, y: y - p.y };
              this.pieces.splice(i, 1);
              this.pieces.push(p);
              break;
            }
          }
        };
        const drag = e => {
          if (!this.dragged) return;
          e.preventDefault();
          const r = c.getBoundingClientRect();
          const x = (e.clientX || e.touches?.[0].clientX) - r.left;
          const y = (e.clientY || e.touches?.[0].clientY) - r.top;
          this.dragged.x = x - this.offset.x;
          this.dragged.y = y - this.offset.y;
          this.renderer.render(this.pieces, this.dragged);
        };
        const endDrag = () => {
          if (!this.dragged) return;
          const d = Math.hypot(
            this.dragged.x + this.dragged.width / 2 - (this.dragged.tx + this.dragged.width / 2),
            this.dragged.y + this.dragged.height / 2 - (this.dragged.ty + this.dragged.height / 2)
          );
          if (d < 50) {
            this.dragged.x = this.dragged.tx;
            this.dragged.y = this.dragged.ty;
            this.dragged.ok = true;
            this.check();
          }
          this.dragged = null;
          this.renderer.render(this.pieces);
        };
        c.addEventListener('mousedown', startDrag);
        c.addEventListener('touchstart', startDrag, { passive: false });
        c.addEventListener('mousemove', drag);
        c.addEventListener('touchmove', drag, { passive: false });
        c.addEventListener('mouseup', endDrag);
        c.addEventListener('touchend', endDrag);
      }
      check() {
        if (this.pieces.every(p => p.ok)) {
          completed.add(this.config.id);
          confetti({ particleCount: 300, spread: 100, origin: { y: 0.6 } });
          document.getElementById('winScreen').style.display = 'flex';
          setTimeout(() => {
            document.getElementById('winScreen').style.display = 'none';
            this.destroy();
            currentPuzzle = null;
            document.getElementById('puzzleCanvas').style.display = 'none';
            document.getElementById('closeBtn').style.display = 'none';
            document.getElementById('hint').style.display = 'block'; // ✅ повернути підказку
          }, 3000);
        }
      }
      render() { this.renderer.render(this.pieces, this.dragged); }
      destroy() {
        const c = this.renderer.canvas;
        c.parentNode.replaceChild(c.cloneNode(true), c);
      }
    }

    const scene = document.querySelector('a-scene');
    scene.addEventListener('loaded', () => {
      PUZZLES.forEach(cfg => {
        const ent = document.createElement('a-entity');
        ent.setAttribute('mindar-image-target', `targetIndex: ${cfg.id}`);

        ent.addEventListener('targetFound', () => {
          if (!currentPuzzle && !completed.has(cfg.id)) {
            document.getElementById('hint').style.display = 'none'; // ✅ ховаємо підказку
            currentPuzzle = new PuzzleEngine(cfg, new PuzzleRenderer(document.getElementById('puzzleCanvas')));
            document.getElementById('puzzleCanvas').style.display = 'block';
            document.getElementById('closeBtn').style.display = 'block';
          }
        });

        // ✅ Виправлення: очищення при втраті маркера
        ent.addEventListener('targetLost', () => {
          if (currentPuzzle && !completed.has(cfg.id)) {
            currentPuzzle.destroy();
            currentPuzzle = null;
            document.getElementById('puzzleCanvas').style.display = 'none';
            document.getElementById('closeBtn').style.display = 'none';
            document.getElementById('hint').style.display = 'block';
          }
        });

        scene.appendChild(ent);
      });

      (async () => {
        try {
          await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
          scene.systems['mindar-image-system'].start();
        } catch (e) {
          document.body.innerHTML = `
            <div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;color:white;font-family:Arial;text-align:center;padding:20px;font-size:24px;line-height:1.5;">
              Камера не працює 😢<br>Онови сторінку і дозволь доступ до камери!
            </div>
          `;
        }
      })();
    });

    document.getElementById('closeBtn').onclick = () => {
      if (currentPuzzle) {
        currentPuzzle.destroy();
        currentPuzzle = null;
      }
      document.getElementById('puzzleCanvas').style.display = 'none';
      document.getElementById('closeBtn').style.display = 'none';
      document.getElementById('hint').style.display = 'block'; // ✅
    };
  </script>
</body>
</html>
